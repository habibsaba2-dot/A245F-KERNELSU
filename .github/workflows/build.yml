name: Build A245F KernelSU SusFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools and Download Source
        run: |
          sudo apt-get update && sudo apt-get install -y file lz4 unzip wget
          mkdir -p $HOME/tools && cd $HOME/tools
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk -O magisk.zip
          unzip -p magisk.zip lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

          mkdir -p $HOME/work && cd $HOME/work
          wget -q https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.001
          wget -q https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.002
          wget -q https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.003
          wget -q https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.004
          wget -q https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.005
          wget -q https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/boot.img.lz4
          cat Kernel.tar.tar.* > Kernel.tar.tar
          tar -xf Kernel.tar.tar
          tar -xzf Kernel.tar.gz
          lz4 -d boot.img.lz4 boot.img

      - name: Inspect Stock boot.img and Kernel Source
        run: |
          mkdir -p $HOME/work/unpack && cd $HOME/work/unpack
          cp $HOME/work/boot.img .
          $HOME/tools/magiskboot unpack boot.img
          echo "=== STOCK KERNEL BINARY TYPE & SIZE ==="
          ls -lh kernel
          file kernel

          KERNEL_ROOT=$(dirname $(find $HOME/work -maxdepth 3 -name "build_kernel.sh" | head -n 1))
          echo "=== SOURCE MAKEFILE VERSION ==="
          head -n 6 "$KERNEL_ROOT/kernel-5.10/Makefile"

          echo "=== SAMSUNG build_kernel.sh ==="
          cat "$KERNEL_ROOT/build_kernel.sh"

          echo "=== CHECK VENDOR SYMBOL ==="
          grep -rn "aed_common_exception_api" "$KERNEL_ROOT/kernel-5.10/" | head -n 5 || true
