name: Build A245F KernelSU SusFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python2 python3 zip unzip cpio lz4 wget gcc-10 g++-10 libc6-dev m4 device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi dwarves rsync kmod pkg-config
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Setup AOSP Clang & Magiskboot
        run: |
          mkdir -p $HOME/toolchain/clang-r416183b
          cd $HOME/toolchain/clang-r416183b
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz
          tar -xzf clang-r416183b.tar.gz && rm clang-r416183b.tar.gz
          
          cat << 'EOF' > $HOME/toolchain/clang-r416183b/bin/x86_64-unknown-linux-gnu.cfg
          -B/usr/lib/x86_64-linux-gnu
          -B/usr/lib/gcc/x86_64-linux-gnu/10
          -L/usr/lib/x86_64-linux-gnu
          -L/usr/lib/gcc/x86_64-linux-gnu/10
          -isystem /usr/include
          -isystem /usr/include/x86_64-linux-gnu
          EOF
          cp $HOME/toolchain/clang-r416183b/bin/x86_64-unknown-linux-gnu.cfg $HOME/toolchain/clang-r416183b/bin/x86_64-linux-gnu.cfg
          
          mkdir -p $HOME/tools && cd $HOME/tools
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk -O magisk.zip
          unzip -p magisk.zip lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

      - name: Download and Merge Kernel Source Parts
        run: |
          mkdir -p $HOME/work && cd $HOME/work
          wget https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.001
          wget https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.002
          wget https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.003
          wget https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.004
          wget https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.005
          wget https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/boot.img.lz4
          cat Kernel.tar.tar.* > Kernel.tar.tar
          tar -xf Kernel.tar.tar
          tar -xzf Kernel.tar.gz
          lz4 -d boot.img.lz4 boot.img
          
          mkdir -p $HOME/work/stock_unpack && cd $HOME/work/stock_unpack
          cp $HOME/work/boot.img .
          $HOME/tools/magiskboot unpack boot.img
          STOCK_VER=$(strings kernel | grep -m1 "Linux version " | awk '{print $3}')
          STOCK_LOCALVER=$(echo "$STOCK_VER" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')
          echo "Stock Kernel Full Version: $STOCK_VER"
          echo "Extracted Stock LOCALVERSION: $STOCK_LOCALVER"
          echo "STOCK_LOCALVER=$STOCK_LOCALVER" >> $GITHUB_ENV
          
          KERNEL_ROOT=$(dirname $(find $HOME/work -maxdepth 3 -name "build_kernel.sh" | head -n 1))
          echo "KERNEL_ROOT=$KERNEL_ROOT" >> $GITHUB_ENV

      - name: Integrate KernelSU-Next and SusFS
        run: |
          chmod -R u+w "$KERNEL_ROOT/kernel-5.10"
          cd "$KERNEL_ROOT/kernel-5.10"
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git $HOME/susfs4ksu
          cp -r $HOME/susfs4ksu/kernel_patches/fs/* fs/
          cp -r $HOME/susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 --fuzz=4 --no-backup-if-mismatch < $HOME/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || true

      - name: Configure Defconfig, ThinLTO, and Disable Protections
        run: |
          DEFCONFIG="$KERNEL_ROOT/kernel-5.10/arch/arm64/configs/a24_00_defconfig"
          OVERLAY_CFG="$KERNEL_ROOT/kernel-5.10/arch/arm64/configs/entry_level.config"
          
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG
          
          for CFG in "$DEFCONFIG" "$OVERLAY_CFG"; do
            if [ -f "$CFG" ]; then
              sed -i 's/CONFIG_LTO_CLANG_FULL=y/# CONFIG_LTO_CLANG_FULL is not set/g' "$CFG"
              sed -i 's/CONFIG_SECURITY_DEFEX=y/# CONFIG_SECURITY_DEFEX is not set/g' "$CFG"
              sed -i 's/CONFIG_PROCA=y/# CONFIG_PROCA is not set/g' "$CFG"
              sed -i 's/CONFIG_FIVE=y/# CONFIG_FIVE is not set/g' "$CFG"
              sed -i 's/CONFIG_UH_RKP=y/# CONFIG_UH_RKP is not set/g' "$CFG"
              sed -i 's/CONFIG_UH_LKMAUTH=y/# CONFIG_UH_LKMAUTH is not set/g' "$CFG"
              sed -i 's/CONFIG_KDP=y/# CONFIG_KDP is not set/g' "$CFG"
              sed -i 's/CONFIG_KDP_CRED=y/# CONFIG_KDP_CRED is not set/g' "$CFG"
              sed -i 's/CONFIG_KDP_NS=y/# CONFIG_KDP_NS is not set/g' "$CFG"
            fi
          done
          echo "CONFIG_LTO_CLANG_THIN=y" >> "$DEFCONFIG"
          
          if [ -n "$STOCK_LOCALVER" ]; then
            sed -i '/^CONFIG_LOCALVERSION=/d' "$DEFCONFIG"
            sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "$DEFCONFIG"
            echo "CONFIG_LOCALVERSION=\"$STOCK_LOCALVER\"" >> "$DEFCONFIG"
            echo "# CONFIG_LOCALVERSION_AUTO is not set" >> "$DEFCONFIG"
          fi

      - name: Link Hermetic Build Tools and Compile Kernel
        run: |
          set -o pipefail
          mkdir -p "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86"
          mkdir -p "$KERNEL_ROOT/kernel/prebuilts/build-tools/linux-x86/bin"
          mkdir -p "$KERNEL_ROOT/prebuilts/build-tools/linux-x86/bin"
          for bin in /usr/bin/* /bin/*; do
            base=$(basename "$bin")
            ln -sf "$bin" "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86/$base" || true
            ln -sf "$bin" "$KERNEL_ROOT/kernel/prebuilts/build-tools/linux-x86/bin/$base" || true
            ln -sf "$bin" "$KERNEL_ROOT/prebuilts/build-tools/linux-x86/bin/$base" || true
          done
          
          rm -f "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86/clang"* \
                "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86/llvm"* \
                "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86/ld.lld"* \
                "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86/lld"* \
                "$KERNEL_ROOT/kernel/prebuilts/build-tools/linux-x86/bin/clang"* \
                "$KERNEL_ROOT/kernel/prebuilts/build-tools/linux-x86/bin/llvm"* \
                "$KERNEL_ROOT/kernel/prebuilts/build-tools/linux-x86/bin/ld.lld"* \
                "$KERNEL_ROOT/prebuilts/build-tools/linux-x86/bin/clang"* \
                "$KERNEL_ROOT/prebuilts/build-tools/linux-x86/bin/llvm"* \
                "$KERNEL_ROOT/prebuilts/build-tools/linux-x86/bin/ld.lld"*
          
          for tool in "$HOME/toolchain/clang-r416183b/bin/"*; do
            tbase=$(basename "$tool")
            ln -sfn "$tool" "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86/$tbase"
          done
          
          mkdir -p "$KERNEL_ROOT/kernel/prebuilts-master/clang/host/linux-x86"
          ln -sfn "$HOME/toolchain/clang-r416183b" "$KERNEL_ROOT/kernel/prebuilts-master/clang/host/linux-x86/clang-r416183b"
          
          mkdir -p "$KERNEL_ROOT/kernel/build/kernel/build-tools" "$KERNEL_ROOT/kernel/build/build-tools"
          ln -sfn / "$KERNEL_ROOT/kernel/build/kernel/build-tools/sysroot"
          ln -sfn / "$KERNEL_ROOT/kernel/build/build-tools/sysroot"
          find "$KERNEL_ROOT/kernel/build" -type f -exec sed -i 's|--sysroot=[^ "]*|--sysroot=/|g' {} +
          
          export PATH="$HOME/toolchain/clang-r416183b/bin:$PATH"
          export CPATH="/usr/include:/usr/include/x86_64-linux-gnu"
          export BISON_PKGDATADIR="/usr/share/bison"
          export M4="/usr/bin/m4"
          
          cd "$KERNEL_ROOT/kernel-5.10"
          python scripts/gen_build_config.py --kernel-defconfig a24_00_defconfig --kernel-defconfig-overlays "entry_level.config" -m user -o ../out/target/product/a24/obj/KERNEL_OBJ/build.config
          
          export ARCH=arm64
          export PLATFORM_VERSION=13
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
          export OUT_DIR="../out/target/product/a24/obj/KERNEL_OBJ"
          export DIST_DIR="../out/target/product/a24/obj/KERNEL_OBJ"
          export BUILD_CONFIG="../out/target/product/a24/obj/KERNEL_OBJ/build.config"
          export CLANG_PREBUILT_BIN="$HOME/toolchain/clang-r416183b/bin"
          export SKIP_ABI_CHECKS=1
          export SKIP_DEFCONFIG_CHECK=1
          
          cd ../kernel
          ./build/build.sh 2>&1 | tee /tmp/build.log || {
            echo "=== SUMMARY OF ERRORS ==="
            grep -iE "error:|not found|fatal:" /tmp/build.log | tail -n 30
            exit 1
          }

      - name: Repack boot.img and Create Odin Tar
        run: |
          mkdir -p /home/runner/output && cd /home/runner/output
          cp $HOME/work/boot.img .
          $HOME/tools/magiskboot unpack boot.img
          
          KERNEL_IMG=$(find "$KERNEL_ROOT/out" -name "Image.gz" | head -n 1)
          if [ -z "$KERNEL_IMG" ]; then
            KERNEL_IMG=$(find "$KERNEL_ROOT/out" -name "Image" | head -n 1)
          fi
          cp "$KERNEL_IMG" kernel
          $HOME/tools/magiskboot repack boot.img new-boot.img
          mv new-boot.img boot.img
          tar -cvf A245F_KSU_SusFS_boot.tar boot.img

      - name: Upload Ready Odin Package
        uses: actions/upload-artifact@v4
        with:
          name: A245F-KSU-SusFS-Odin
          path: /home/runner/output/A245F_KSU_SusFS_boot.tar
