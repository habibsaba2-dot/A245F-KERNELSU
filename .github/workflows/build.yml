name: Build A245F KernelSU SusFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository (Get a24_stock_config.txt)
        uses: actions/checkout@v4

      - name: Enable 16GB Swap and Install Build Dependencies
        run: |
          df -h
          if [ -d /mnt ] && [ $(df -BG --output=avail /mnt | tail -1 | tr -dc '0-9') -ge 20 ]; then
            SWAP_PATH="/mnt/swapfile"
          else
            SWAP_PATH="/swapfile"
          fi
          sudo fallocate -l 16G "$SWAP_PATH" || sudo dd if=/dev/zero of="$SWAP_PATH" bs=1M count=16384
          sudo chmod 600 "$SWAP_PATH"
          sudo mkswap "$SWAP_PATH"
          sudo swapon "$SWAP_PATH"
          free -h
          
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python2 python3 zip unzip cpio lz4 wget gcc-10 g++-10 libc6-dev m4 device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi dwarves rsync kmod pkg-config
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Setup AOSP Clang & Magiskboot
        run: |
          mkdir -p $HOME/toolchain/clang-r416183b
          cd $HOME/toolchain/clang-r416183b
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz
          tar -xzf clang-r416183b.tar.gz && rm clang-r416183b.tar.gz
          
          cat << 'EOF' > $HOME/toolchain/clang-r416183b/bin/x86_64-unknown-linux-gnu.cfg
          -B/usr/lib/x86_64-linux-gnu
          -B/usr/lib/gcc/x86_64-linux-gnu/10
          -L/usr/lib/x86_64-linux-gnu
          -L/usr/lib/gcc/x86_64-linux-gnu/10
          -isystem /usr/include
          -isystem /usr/include/x86_64-linux-gnu
          EOF
          cp $HOME/toolchain/clang-r416183b/bin/x86_64-unknown-linux-gnu.cfg $HOME/toolchain/clang-r416183b/bin/x86_64-linux-gnu.cfg
          
          mkdir -p $HOME/tools && cd $HOME/tools
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk -O magisk.zip
          unzip -p magisk.zip lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

      - name: Download and Merge Kernel Source Parts
        run: |
          mkdir -p $HOME/work && cd $HOME/work
          wget https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.001
          wget https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.002
          wget https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.003
          wget https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.004
          wget https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/Kernel.tar.tar.005
          wget https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/boot.img.lz4
          cat Kernel.tar.tar.* > Kernel.tar.tar
          tar -xf Kernel.tar.tar
          tar -xzf Kernel.tar.gz
          lz4 -d boot.img.lz4 boot.img
          
          mkdir -p $HOME/work/stock_unpack && cd $HOME/work/stock_unpack
          cp $HOME/work/boot.img .
          $HOME/tools/magiskboot unpack boot.img
          STOCK_VER=$(strings kernel | grep -m1 "Linux version " | awk '{print $3}')
          STOCK_LOCALVER=$(echo "$STOCK_VER" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')
          echo "Stock Kernel Full Version: $STOCK_VER"
          echo "Extracted Stock LOCALVERSION: $STOCK_LOCALVER"
          echo "STOCK_LOCALVER=$STOCK_LOCALVER" >> $GITHUB_ENV
          
          KERNEL_ROOT=$(dirname $(find $HOME/work -maxdepth 3 -name "build_kernel.sh" | head -n 1))
          echo "KERNEL_ROOT=$KERNEL_ROOT" >> $GITHUB_ENV

      - name: Integrate KernelSU-Next (Manual Hooks) and Module Compatibility
        if: false
        run: |
          chmod -R u+w "$KERNEL_ROOT"
          cd "$KERNEL_ROOT/kernel-5.10"
          touch .scmversion
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          echo "=== KERNELSU KCONFIG OPTIONS ==="
          cat drivers/kernelsu/Kconfig || true
          
          python3 - << 'EOF'
          import os, re, glob

          ksu_src = ""
          for p in glob.glob("drivers/kernelsu/**/*.[ch]", recursive=True):
              with open(p, "r", errors="ignore") as f:
                  ksu_src += f.read() + "\n"

          def has_func_def(name):
              return bool(re.search(rf'\b(?:int|void|long)\s+{name}\s*\(', ksu_src))

          has_exec_def = has_func_def("ksu_handle_execveat")
          has_exec_sucompat_def = has_func_def("ksu_handle_execveat_sucompat")
          has_faccessat_def = has_func_def("ksu_handle_faccessat")
          has_stat_def = has_func_def("ksu_handle_stat")
          has_input_def = has_func_def("ksu_handle_input_handle_event")

          has_exec_hook_var = "ksu_execveat_hook" in ksu_src
          has_input_var = "ksu_input_hook" in ksu_src
          print(f"KSU hook defs: exec={has_exec_def}, sucompat={has_exec_sucompat_def}, faccessat={has_faccessat_def}, stat={has_stat_def}, input={has_input_def}")

          # Hook 1: fs/exec.c
          if has_exec_def or has_exec_sucompat_def:
              with open("fs/exec.c", "r") as f:
                  txt = f.read()
              if "ksu_handle_execveat" not in txt:
                  decl = (
                      "#ifdef CONFIG_KSU\n"
                      + ("extern bool ksu_execveat_hook __read_mostly;\n" if has_exec_hook_var else "")
                      + ("extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n" if has_exec_def else "")
                      + ("extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n" if has_exec_sucompat_def else "")
                      + "#endif\n"
                  )
                  if has_exec_hook_var and has_exec_def and has_exec_sucompat_def:
                      call = (
                          "#ifdef CONFIG_KSU\n"
                          "\tif (unlikely(ksu_execveat_hook))\n"
                          "\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                          "\telse\n"
                          "\t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n"
                          "#endif\n"
                      )
                  elif has_exec_sucompat_def:
                      call = (
                          "#ifdef CONFIG_KSU\n"
                          "\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n"
                          "#endif\n"
                      )
                  else:
                      call = (
                          "#ifdef CONFIG_KSU\n"
                          "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                          "#endif\n"
                      )
                  txt, n1 = re.subn(r'(static int do_execveat_common\s*\()', decl + r'\1', txt, count=1)
                  txt, n2 = re.subn(r'(if\s*\(\s*IS_ERR\(\s*filename\s*\)\s*\)\s*return\s+PTR_ERR\(\s*filename\s*\)\s*;)', r'\1\n' + call, txt, count=1)
                  assert n1 == 1 and n2 == 1, f"Failed patching fs/exec.c ({n1}, {n2})"
                  with open("fs/exec.c", "w") as f:
                      f.write(txt)
                  print("Patched fs/exec.c")

          # Hook 2: fs/open.c
          if has_faccessat_def:
              with open("fs/open.c", "r") as f:
                  txt = f.read()
              if "ksu_handle_faccessat" not in txt:
                  decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n"
                  call = "#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, &flags);\n#endif\n"
                  txt, n1 = re.subn(r'(long do_faccessat\s*\()', decl + r'\1', txt, count=1)
                  txt, n2 = re.subn(r'(if\s*\(\s*mode\s*&\s*~S_IRWXO\s*\))', call + r'\t\1', txt, count=1)
                  assert n1 == 1 and n2 == 1, f"Failed patching fs/open.c ({n1}, {n2})"
                  with open("fs/open.c", "w") as f:
                      f.write(txt)
                  print("Patched fs/open.c")

          # Hook 3: fs/stat.c
          if has_stat_def:
              with open("fs/stat.c", "r") as f:
                  txt = f.read()
              if "ksu_handle_stat" not in txt:
                  decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif\n"
                  call = "#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flags);\n#endif\n"
                  txt, n1 = re.subn(r'(static int vfs_statx\s*\()', decl + r'\1', txt, count=1)
                  txt, n2 = re.subn(r'(if\s*\(\s*\(\s*flags\s*&\s*~\(\s*AT_SYMLINK_NOFOLLOW)', call + r'\t\1', txt, count=1)
                  assert n1 == 1 and n2 == 1, f"Failed patching fs/stat.c ({n1}, {n2})"
                  with open("fs/stat.c", "w") as f:
                      f.write(txt)
                  print("Patched fs/stat.c")

          # Hook 4: drivers/input/input.c
          if has_input_def:
              with open("drivers/input/input.c", "r") as f:
                  txt = f.read()
              if "ksu_handle_input_handle_event" not in txt:
                  decl = (
                      "#ifdef CONFIG_KSU\n"
                      + ("extern bool ksu_input_hook __read_mostly;\n" if has_input_var else "")
                      + "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n"
                      + "#endif\n"
                  )
                  call = (
                      "#ifdef CONFIG_KSU\n"
                      + ("\tif (unlikely(ksu_input_hook))\n\t\t" if has_input_var else "\t")
                      + "ksu_handle_input_handle_event(&type, &code, &value);\n"
                      + "#endif\n"
                  )
                  txt, n1 = re.subn(r'(void input_event\s*\()', decl + r'\1', txt, count=1)
                  txt, n2 = re.subn(r'(if\s*\(\s*is_event_supported\(\s*type\s*,\s*dev->evbit\s*,\s*EV_MAX\s*\)\s*\)\s*\{)', r'\1\n' + call, txt, count=1)
                  assert n1 == 1 and n2 == 1, f"Failed patching drivers/input/input.c ({n1}, {n2})"
                  with open("drivers/input/input.c", "w") as f:
                      f.write(txt)
                  print("Patched drivers/input/input.c")

          # Patch check_version in kernel/module.c
          mod_file = "kernel/module.c"
          if os.path.exists(mod_file):
              os.chmod(mod_file, 0o644)
              with open(mod_file, "r") as f:
                  mcontent = f.read()
              m = re.search(r'static\s+int\s+check_version\s*\([^;]*?\)\s*\{', mcontent, flags=re.DOTALL)
              if m:
                  idx = m.start()
                  end_idx = mcontent.find("\n}", idx)
                  if end_idx != -1:
                      func_body = mcontent[idx:end_idx]
                      if "return 0;" in func_body:
                          func_body = func_body.replace("return 0;", "return 1;")
                          mcontent = mcontent[:idx] + func_body + mcontent[end_idx:]
                          with open(mod_file, "w") as f:
                              f.write(mcontent)
          EOF

      - name: Link Hermetic Build Tools and Compile Kernel from Exact Stock Config
        run: |
          chmod -R u+w "$KERNEL_ROOT"
          mkdir -p "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86"
          mkdir -p "$KERNEL_ROOT/kernel/prebuilts/build-tools/linux-x86/bin"
          mkdir -p "$KERNEL_ROOT/prebuilts/build-tools/linux-x86/bin"
          for bin in /usr/bin/* /bin/*; do
            base=$(basename "$bin")
            ln -sf "$bin" "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86/$base" || true
            ln -sf "$bin" "$KERNEL_ROOT/kernel/prebuilts/build-tools/linux-x86/bin/$base" || true
            ln -sf "$bin" "$KERNEL_ROOT/prebuilts/build-tools/linux-x86/bin/$base" || true
          done
          
          rm -f "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86/clang"* \
                "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86/llvm"* \
                "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86/ld.lld"* \
                "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86/lld"* \
                "$KERNEL_ROOT/kernel/prebuilts/build-tools/linux-x86/bin/clang"* \
                "$KERNEL_ROOT/kernel/prebuilts/build-tools/linux-x86/bin/llvm"* \
                "$KERNEL_ROOT/kernel/prebuilts/build-tools/linux-x86/bin/ld.lld"* \
                "$KERNEL_ROOT/prebuilts/build-tools/linux-x86/bin/clang"* \
                "$KERNEL_ROOT/prebuilts/build-tools/linux-x86/bin/llvm"* \
                "$KERNEL_ROOT/prebuilts/build-tools/linux-x86/bin/ld.lld"*
          
          for tool in "$HOME/toolchain/clang-r416183b/bin/"*; do
            tbase=$(basename "$tool")
            ln -sfn "$tool" "$KERNEL_ROOT/kernel/build/build-tools/path/linux-x86/$tbase"
          done
          
          mkdir -p "$KERNEL_ROOT/kernel/prebuilts-master/clang/host/linux-x86"
          ln -sfn "$HOME/toolchain/clang-r416183b" "$KERNEL_ROOT/kernel/prebuilts-master/clang/host/linux-x86/clang-r416183b"
          
          mkdir -p "$KERNEL_ROOT/kernel/build/kernel/build-tools" "$KERNEL_ROOT/kernel/build/build-tools"
          ln -sfn / "$KERNEL_ROOT/kernel/build/kernel/build-tools/sysroot"
          ln -sfn / "$KERNEL_ROOT/kernel/build/build-tools/sysroot"
          find "$KERNEL_ROOT/kernel/build" -type f -exec sed -i 's|--sysroot=[^ "]*|--sysroot=/|g' {} +
          
          export PATH="$HOME/toolchain/clang-r416183b/bin:$PATH"
          export CPATH="/usr/include:/usr/include/x86_64-linux-gnu"
          export BISON_PKGDATADIR="/usr/share/bison"
          export M4="/usr/bin/m4"
          
          cd "$KERNEL_ROOT/kernel-5.10"
          OUT_FULL="$KERNEL_ROOT/out/target/product/a24/obj/KERNEL_OBJ"
          mkdir -p "$OUT_FULL"
          
          python scripts/gen_build_config.py \
            --kernel-defconfig a24_00_defconfig \
            --kernel-defconfig-overlays "entry_level.config" \
            -m user \
            -o "$OUT_FULL/build.config"
          
          cat << 'EOF' >> "$OUT_FULL/build.config"
          
          if [ -n "$POST_DEFCONFIG_CMDS" ]; then
            POST_DEFCONFIG_CMDS="$POST_DEFCONFIG_CMDS && update_ksu_susfs_config"
          else
            POST_DEFCONFIG_CMDS="update_ksu_susfs_config"
          fi
          
          function update_ksu_susfs_config() {
            cp "$GITHUB_WORKSPACE/a24_stock_config.txt" ${OUT_DIR}/.config
            ${KERNEL_DIR}/scripts/config --file ${OUT_DIR}/.config \
              -e CFI_PERMISSIVE \
              -d TRIM_UNUSED_KSYMS \
              -d UBSAN_TRAP \
              -d WERROR \
              -d LOCALVERSION_AUTO \
              -d KSU
            if [ -n "$STOCK_LOCALVER" ]; then
              ${KERNEL_DIR}/scripts/config --file ${OUT_DIR}/.config --set-str LOCALVERSION "$STOCK_LOCALVER"
            fi
            (cd ${OUT_DIR} && make ${TOOL_ARGS} O=${OUT_DIR} olddefconfig)
            echo "=== VERIFIED CLEAN STOCK .CONFIG ==="
            grep -E "CONFIG_KSU|CONFIG_LTO_CLANG|CONFIG_CFI|CONFIG_SHADOW_CALL|CONFIG_TRIM_UNUSED|CONFIG_LOCALVERSION=" ${OUT_DIR}/.config || true
          }
          EOF
          
          python3 - << 'EOF'
          import os, re
          bsh = os.environ["KERNEL_ROOT"] + "/kernel/build/build.sh"
          if os.path.exists(bsh):
              os.chmod(bsh, 0o755)
              with open(bsh, "r") as f:
                  txt = f.read()
              txt = re.sub(r'Building external modules[^\n"]*', 'Skipping external modules"\nEXT_MODULES=""\nEXT_MODULES_MAKEFILE=""\necho "External modules skipped', txt)
              with open(bsh, "w") as f:
                  f.write(txt)
          EOF
          
          export ARCH=arm64
          export PLATFORM_VERSION=13
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
          export OUT_DIR="../out/target/product/a24/obj/KERNEL_OBJ"
          export DIST_DIR="../out/target/product/a24/obj/KERNEL_OBJ"
          export BUILD_CONFIG="../out/target/product/a24/obj/KERNEL_OBJ/build.config"
          export CLANG_PREBUILT_BIN="$HOME/toolchain/clang-r416183b/bin"
          export SKIP_ABI_CHECKS=1
          export SKIP_DEFCONFIG_CHECK=1
          
          cd ../kernel
          set +e
          ./build/build.sh 2>&1 | tee /tmp/build.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_RC" -ne 0 ]; then
            if find "$KERNEL_ROOT/out" -path "*/arch/arm64/boot/Image*" | grep -q .; then
              echo "Kernel image compiled successfully; proceeding to repack boot.img."
            else
              grep -iE "error:|Error [0-9]|not found|fatal:" /tmp/build.log | tail -n 30
              exit 1
            fi
          fi

      - name: Repack boot.img and Create Odin Tar
        run: |
          mkdir -p /home/runner/output && cd /home/runner/output
          cp $HOME/work/boot.img .
          $HOME/tools/magiskboot unpack boot.img
          
          KERNEL_IMG=$(find "$KERNEL_ROOT/out" -path "*/arch/arm64/boot/Image" | head -n 1)
          if [ -z "$KERNEL_IMG" ]; then
            KERNEL_IMG=$(find "$KERNEL_ROOT/out" -path "*/arch/arm64/boot/Image.gz" | head -n 1)
          fi
          ls -lh "$KERNEL_IMG"
          cp "$KERNEL_IMG" kernel
          $HOME/tools/magiskboot repack boot.img new-boot.img
          mv new-boot.img boot.img
          tar -cvf A245F_KSU_SusFS_boot.tar boot.img

      - name: Upload Ready Odin Package
        uses: actions/upload-artifact@v4
        with:
          name: A245F-KSU-SusFS-Odin
          path: /home/runner/output/A245F_KSU_SusFS_boot.tar
