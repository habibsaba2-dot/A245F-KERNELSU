name: Build A245F KernelSU SusFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Tools and Download Stock boot.img
        run: |
          sudo apt-get update && sudo apt-get install -y lz4 unzip wget
          mkdir -p $HOME/tools $HOME/work
          cd $HOME/tools
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk -O magisk.zip
          unzip -p magisk.zip lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

          cd $HOME/work
          wget -q https://github.com/habibsaba2-dot/A245F-KERNELSU/releases/download/v1.0/boot.img.lz4
          lz4 -d boot.img.lz4 stock_boot.img

      - name: Unpack and Repack Untouched Stock boot.img
        run: |
          mkdir -p $HOME/work/repack_test && cd $HOME/work/repack_test
          cp $HOME/work/stock_boot.img boot.img
          echo "=== UNPACKING STOCK BOOT.IMG ==="
          $HOME/tools/magiskboot unpack boot.img
          echo "=== REPACKING WITHOUT ANY KERNEL CHANGE ==="
          $HOME/tools/magiskboot repack boot.img new-boot.img
          mv new-boot.img boot.img
          ls -lh boot.img
          tar -cvf A245F_Stock_Repack_Test.tar boot.img

      - name: Upload Repacked Stock Test Package
        uses: actions/upload-artifact@v4
        with:
          name: A245F-Stock-Repack-Test
          path: /home/runner/work/repack_test/A245F_Stock_Repack_Test.tar
